name: CI
on:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Cache Dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{runner.os}}-${{hashFiles('CmakeLists.txt')}}
